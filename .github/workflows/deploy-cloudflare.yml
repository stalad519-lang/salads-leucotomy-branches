name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify hand-ui assets
        run: |
          ls -la out/hand-ui
          test -f out/hand-ui/panel-torn.png

      - name: Prepare publish folder
        run: |
          rm -rf /tmp/wiki-cf-deploy
          mkdir -p /tmp/wiki-cf-deploy
          cp -a out/. /tmp/wiki-cf-deploy/
          find /tmp/wiki-cf-deploy -name '*.txt' -delete
          find /tmp/wiki-cf-deploy -name '*:*' -exec rm -rf {} + 2>/dev/null || true
          test -f /tmp/wiki-cf-deploy/hand-ui/panel-torn.png

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy /tmp/wiki-cf-deploy --project-name=salads-leucotomy-branches --commit-dirty=true
