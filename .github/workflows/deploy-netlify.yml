name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare publish folder
        run: |
          rm -rf /tmp/wiki-deploy
          mkdir -p /tmp/wiki-deploy
          cp -a out/. /tmp/wiki-deploy/
          find /tmp/wiki-deploy -name '*.txt' -delete
          find /tmp/wiki-deploy -name '*:*' -exec rm -rf {} + 2>/dev/null || true

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx --yes netlify-cli deploy \
            --dir /tmp/wiki-deploy \
            --no-build \
            --prod \
            --site "$NETLIFY_SITE_ID" \
            --message "GitHub Actions ${GITHUB_SHA::7}"
