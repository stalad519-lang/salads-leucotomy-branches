name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify hand-ui assets
        run: |
          ls -la out/hand-ui
          test -f out/hand-ui/panel-torn.png

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s' "${NETLIFY_AUTH_TOKEN:-}" | tr -d '\r\n[:space:]')"
          SITE_ID="$(printf '%s' "${NETLIFY_SITE_ID:-9adc9168-5491-4e81-9bfc-9f19068b0ab6}" | tr -d '\r\n[:space:]')"

          if [ -z "$TOKEN" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN secret is empty. Add it under Settings → Secrets → Actions."
            exit 1
          fi
          if [ -z "$SITE_ID" ]; then
            echo "::error::NETLIFY_SITE_ID secret is empty."
            exit 1
          fi

          echo "token_len=${#TOKEN} site=$SITE_ID"

          http_code="$(curl -sS -o /tmp/netlify-user.json -w '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            https://api.netlify.com/api/v1/user || true)"
          echo "netlify_auth_http=${http_code}"
          if [ "$http_code" != "200" ]; then
            echo "::error::Netlify rejected the token (HTTP ${http_code}). Create a new Personal Access Token and update NETLIFY_AUTH_TOKEN."
            head -c 400 /tmp/netlify-user.json || true
            echo
            exit 1
          fi

          site_code="$(curl -sS -o /tmp/netlify-site.json -w '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://api.netlify.com/api/v1/sites/${SITE_ID}" || true)"
          echo "netlify_site_http=${site_code}"
          if [ "$site_code" != "200" ]; then
            echo "::error::Site id ${SITE_ID} was not found for this token (HTTP ${site_code})."
            head -c 400 /tmp/netlify-site.json || true
            echo
            exit 1
          fi

          rm -rf /tmp/wiki-deploy
          mkdir -p /tmp/wiki-deploy
          cp -a out/. /tmp/wiki-deploy/
          find /tmp/wiki-deploy -name '*.txt' -delete
          find /tmp/wiki-deploy -name '*:*' -exec rm -rf {} + 2>/dev/null || true
          test -f /tmp/wiki-deploy/hand-ui/panel-torn.png

          set +e
          npx --yes netlify-cli@23.1.0 deploy \
            --dir /tmp/wiki-deploy \
            --prod \
            --site "$SITE_ID" \
            --auth "$TOKEN" \
            --message "GHA ${GITHUB_SHA:0:7}" \
            > /tmp/netlify-deploy-out.txt 2>&1
          status=$?
          set -e
          cat /tmp/netlify-deploy-out.txt
          if [ "$status" -ne 0 ]; then
            if grep -qi 'credit usage exceeded' /tmp/netlify-deploy-out.txt; then
              echo "::error::Netlify account credits are exhausted. New deploys are blocked until credits are added or the monthly allowance resets. Your GitHub commits are safe."
            elif grep -qi 'Project not found' /tmp/netlify-deploy-out.txt; then
              echo "::error::Netlify CLI could not deploy this site. Often this is a wrong NETLIFY_SITE_ID or exhausted account credits."
            else
              echo "::error::Netlify deploy failed. See log above."
            fi
            exit "$status"
          fi
